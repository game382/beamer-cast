<!doctype html><meta charset="utf-8"><title>Beamer latency clock</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Consolas,"Courier New",monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
#t{font-size:15vw;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#bar{width:90vw;height:6vh;background:#222;position:relative;border-radius:6px;overflow:hidden}
#bar i{position:absolute;top:0;bottom:0;width:2%;background:#BB0000}
small{color:#A7B1B7;font-size:2.2vw}
</style>
<div id="t">00:00:00.000</div>
<div id="bar"><i id="i"></i></div>
<small>Beamer latency clock: share THIS tab, then photograph the PC screen and the TV together. Delay = difference between the two clocks.</small>
<script>
const t = document.getElementById('t'), i = document.getElementById('i');
const p = n => String(n).padStart(2, '0');
function tick() {
  const d = new Date(), ms = d.getMilliseconds();
  t.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(ms).padStart(3, '0')}`;
  i.style.left = (((d.getSeconds() * 1000 + ms) % 2000) / 2000 * 98) + '%';   // sweeping bar: makes motion/stutter visible
  requestAnimationFrame(tick);
}
tick();
</script>
